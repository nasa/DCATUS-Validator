[project]
name = "dcatus-validator"
version = "0.1.0"
description = "Validator for DCAT-US json files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.22.0",
    "rfc3987>=1.3.8",
    "click (>=8.3.1,<9.0.0)",
    "curl-cffi (>=0.7.0,<1.0.0)",
    "langcodes[data] (>=3.5.0,<4.0.0)",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
dcatus-validate = "dcatus_validator.validate:main"
dcatus-upgrade = "dcatus_validator.upgrade:main"
dcatus-downgrade = "dcatus_validator.downgrade:main"

[dependency-groups]
dev = [
    "ruff>=0.11.9",
]

[tool.ruff.lint]
select = ["I"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"